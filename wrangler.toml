# Wrangler configuration — Luxedge Cloudflare deployment (reproducible from repo).
#
# Default target: PRODUCTION worker (luxedge-production) — serves the Vite SPA
# from dist/ via the ASSETS binding and runs the api/* handlers through
# worker/index.ts. `wrangler deploy` = production; `wrangler deploy --env
# staging` = luxedge-cloudflare-staging.
name = "luxedge-production"
main = "worker/index.ts"
account_id = "f542683e97458480452b0b8ef37a898a"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
# Preserve non-secret variables configured in the Cloudflare dashboard during
# deploys (for example the AdSense OAuth client ID).
keep_vars = true

[assets]
directory = "dist"
binding = "ASSETS"
# CRITICAL: SPA fallback is implemented in worker/index.ts ONLY for non-file
# page routes (via maybeInjectSeo). The ASSETS binding itself must NOT serve
# index.html for missing file requests: after a deploy, stale HTML can
# reference hashed chunks that no longer exist, and answering /assets/*.js
# with 200 + HTML makes browsers parse HTML as a module -> React never boots
# and the page hangs on the SSR article text (the reported "only text, keeps
# loading" bug). "none" lets ASSETS return a real 404 for missing files so a
# stale shell fails fast and the next fresh page load recovers.
not_found_handling = "none"
run_worker_first = true

# Cloudflare Email Sending (outbound from sales@luxedge.us) — the send_email
# binding is available on Workers Paid plan (beta). Sending to verified
# destination addresses (8002salman@gmail.com) is free on all plans.
[[send_email]]
name = "SEND_MAIL"

# Plain-text env (non-secret). Secrets are set with `wrangler secret put`.
# Embani ERP sync (Admin → Orders → ERP Sync):
#   * EMBANI_ERP_WEBHOOK_URL — set via `wrangler var put EMBANI_ERP_WEBHOOK_URL`
#     (or the Cloudflare dashboard) if the URL contains no secret.
#   * EMBANI_ERP_API_TOKEN   — SECRET: `wrangler secret put EMBANI_ERP_API_TOKEN`.
#   Either can instead be attached from Admin → Orders → ERP Sync (stored in
#   app_settings, server-side only); env values always win.
[vars]
VERCEL_ENV = "production"
DEPLOYMENT_ENV = "production"
# Cloudflare Email Routing management (self-service addresses). The API token
# itself is a SECRET (wrangler secret put CLOUDFLARE_API_TOKEN).
CLOUDFLARE_ACCOUNT_ID = "f542683e97458480452b0b8ef37a898a"
CLOUDFLARE_ZONE_ID = "33109dc6283b9e9cdafc2d1a0b05b6f8"
# YouTube Media Hub — non-secret vars (the API key itself is a SECRET:
# `wrangler secret put YOUTUBE_API_KEY`). Channel values verified from the
# owner data of the channel's real video YOBlXCyOh28 (2026-09-03).
YOUTUBE_CHANNEL_ID = "UCPvPDstYz61AebGhKzKS1lw"
YOUTUBE_CHANNEL_URL = "https://www.youtube.com/@TheAIWithSalman"

# Scheduled tasks (handled by the `scheduled` export in worker/index.ts):
#   * `0 * * * *` — hourly auto-sync of the official YouTube channel's uploads
#     into /media (no manual Sync click needed; same idempotent runMediaSync()
#     as the manual endpoint, ~3 YouTube Data API quota units per run).
#   * `0 3 * * *` — nightly sitemap health check: crawls every /sitemap.xml
#     URL and alerts (SEND_MAIL) if any returns non-200, so the sitemap can
#     never silently go stale again.
[triggers]
crons = ["0 * * * *", "0 3 * * *"]

# ============================================================================
# CLOUDFLARE D1 — $0 database replacement for the Supabase read dependency
# ============================================================================
# Production Supabase is hard-restricted (HTTP 402 exceed_egress_quota), which
# emptied /shop and forced the emergency static sitemap. D1 (Free: 10 databases,
# 500 MB each, 5 GB/account, 5M rows read + 100k rows written per day, no egress
# charges) carries the storefront read surface instead, at $0.
#
# IMPORTANT: `d1_databases` is NOT inheritable across environments, so the
# staging binding is declared explicitly under [env.staging] below. Both use the
# same migrations_dir, so `wrangler d1 migrations apply` works for either.
#
# Deploying a binding alone changes NO behaviour: the Worker only reads D1 when
# DATA_BACKEND=d1, so adding this binding is inert until the cutover flips it.
[[d1_databases]]
binding = "DB"
database_name = "luxedge-production-db"
database_id = "43bbff72-1294-4aa8-a3f0-24ea74e82c20"
migrations_dir = "cloudflare/d1/migrations"

[env.staging]
name = "luxedge-cloudflare-staging"

[env.staging.vars]
VERCEL_ENV = "preview"
DEPLOYMENT_ENV = "staging"
# Staging reads D1. Production stays on Supabase until the D1 cutover is
# explicitly verified and flipped there too.
DATA_BACKEND = "d1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "luxedge-staging-db"
database_id = "41b939a3-f7ee-4d8c-8bf5-83d6f8dbe0d2"
migrations_dir = "cloudflare/d1/migrations"
