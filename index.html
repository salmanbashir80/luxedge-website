<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxedge | Premium USA Fashion Store</title>
    <meta name="description" content="Shop women's and men's clothing, dresses, jeans, jackets, sneakers, handbags, jewelry, watches, and sunglasses. USA shipping and clear return information at Luxedge." />
    <meta name="keywords" content="Luxedge, fashion, clothing, women's clothing, men's clothing, dresses, jeans, jackets, sneakers, handbags, wallets, jewelry, watches, sunglasses, USA online store" />
    <meta name="author" content="Luxedge" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="google-adsense-account" content="ca-pub-5473713135927706" />
    <!-- Google AdSense account verification meta (ca-pub-5473713135927706).
         Consent discipline: the publisher SCRIPT is NOT tag-gated in the shell
         — the inline bootstrap below holds Consent Mode v2 at 'denied' before
         any Google tag can load, and the client loader (src/lib/marketing.ts)
         removes this tag for visitors who have not accepted. A visitor who
         declines never executes the publisher script beyond its header fetch,
         and EEA/UK/CH traffic runs on denied consent signals by default.
         When a Google-certified CMP is connected it replaces this bootstrap's
         defaults with the certified widget's own signal handling. -->
    <script>
      // Google Consent Mode v2 — denied defaults, set before any Google tag.
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
    </script>
    <script
      async
      id="adsbygoogle-script"
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5473713135927706"
      crossorigin="anonymous">
    </script>
    <link rel="canonical" href="https://luxedge.us" />
    <link rel="icon" type="image/png" href="/luxedge-mark.png" />

    <!-- Installable app (PWA): buyer manifest by default; the admin routes
         switch to the admin-scoped manifest at runtime (see App.tsx) so
         installing from /admin/* produces a standalone "Luxedge Admin" app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luxedge" />
    <link rel="apple-touch-icon" href="/luxedge-mark.png" />

    <!-- LCP hero image — preload so the above-the-fold hero doesn't wait on a
         late image fetch on slow connections (mirrors src/App.tsx master hero image). -->
    <link rel="preload" as="image" href="/images/fashion/women-clothing.jpg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Luxedge — Premium USA Fashion Store" />
    <meta property="og:description" content="Curated fashion for women and men, shipped within the USA. Clear delivery options and return policies." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://luxedge.us" />
    <meta property="og:site_name" content="Luxedge" />
    <meta property="og:image" content="https://luxedge.us/luxedge-mark.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Luxedge — Premium USA Fashion Store" />
    <meta name="twitter:description" content="Curated fashion for women and men, shipped within the USA. Clear delivery options and return policies." />
    <meta name="twitter:image" content="https://luxedge.us/luxedge-lockup.svg" />

    <!-- Fonts: self-hosted via @fontsource-variable (bundled at build) — no
         external Google Fonts dependency, so typography loads reliably on
         every network. See src/index.css. -->

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "OnlineStore"],
      "name": "Luxedge",
      "brand": { "@type": "Brand", "name": "Luxedge" },
      "legalName": "Embani LLC",
      "url": "https://luxedge.us",
      "logo": "https://luxedge.us/luxedge-mark.png",
      "description": "Premium curated fashion — women's and men's clothing, dresses, jeans, jackets, sneakers, handbags, jewelry, watches, and sunglasses, shipped within the USA.",
      "email": "hello@luxedge.us",
      "telephone": "+1-440-941-8002",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1500 N Grant St",
        "addressLocality": "Denver",
        "addressRegion": "CO",
        "postalCode": "80203",
        "addressCountry": "US"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
